<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Ghar</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== خلفية صحراوية ===== */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        /* السماء الصحراوية */
        .sky {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                #1a0a00 0%,
                #3d1a00 20%,
                #c2440a 45%,
                #e8720c 60%,
                #f59e0b 72%,
                #fcd34d 82%,
                #fed7aa 90%,
                #fde8c8 100%
            );
        }

        /* الشمس / غروب */
        .sun {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #fff7c0 0%, #fcd34d 40%, #f59e0b 70%, transparent 100%);
            border-radius: 50%;
            bottom: 34%;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 60px 30px rgba(252,211,77,0.35), 0 0 120px 60px rgba(245,158,11,0.15);
            animation: sunPulse 4s ease-in-out infinite;
        }
        @keyframes sunPulse {
            0%,100% { box-shadow: 0 0 60px 30px rgba(252,211,77,0.35), 0 0 120px 60px rgba(245,158,11,0.15); }
            50%      { box-shadow: 0 0 80px 40px rgba(252,211,77,0.5),  0 0 160px 80px rgba(245,158,11,0.25); }
        }

        /* أشعة الشمس */
        .sun-rays {
            position: absolute;
            width: 300px;
            height: 300px;
            bottom: 28%;
            left: 50%;
            transform: translateX(-50%);
            background: conic-gradient(
                from 0deg,
                transparent 0deg, rgba(253,230,138,0.08) 5deg, transparent 10deg,
                transparent 20deg, rgba(253,230,138,0.06) 25deg, transparent 30deg,
                transparent 40deg, rgba(253,230,138,0.08) 45deg, transparent 50deg,
                transparent 60deg, rgba(253,230,138,0.06) 65deg, transparent 70deg,
                transparent 80deg, rgba(253,230,138,0.08) 85deg, transparent 90deg,
                transparent 100deg, rgba(253,230,138,0.06) 105deg, transparent 110deg,
                transparent 120deg, rgba(253,230,138,0.08) 125deg, transparent 130deg,
                transparent 140deg, rgba(253,230,138,0.06) 145deg, transparent 150deg,
                transparent 160deg, rgba(253,230,138,0.08) 165deg, transparent 170deg,
                transparent 180deg, rgba(253,230,138,0.06) 185deg, transparent 190deg,
                transparent 200deg, rgba(253,230,138,0.08) 205deg, transparent 210deg,
                transparent 220deg, rgba(253,230,138,0.06) 225deg, transparent 230deg,
                transparent 240deg, rgba(253,230,138,0.08) 245deg, transparent 250deg,
                transparent 260deg, rgba(253,230,138,0.06) 265deg, transparent 270deg,
                transparent 280deg, rgba(253,230,138,0.08) 285deg, transparent 290deg,
                transparent 300deg, rgba(253,230,138,0.06) 305deg, transparent 310deg,
                transparent 320deg, rgba(253,230,138,0.08) 325deg, transparent 330deg,
                transparent 340deg, rgba(253,230,138,0.06) 345deg, transparent 350deg,
                transparent 360deg
            );
            border-radius: 50%;
            animation: rotateSun 20s linear infinite;
        }
        @keyframes rotateSun { from { transform: translateX(-50%) rotate(0deg); } to { transform: translateX(-50%) rotate(360deg); } }

        /* الكثبان الرملية */
        .dunes {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 38%;
        }
        .dune1 {
            position: absolute;
            bottom: 0; left: -5%; right: -5%;
            height: 100%;
            background: linear-gradient(180deg, #c2782a 0%, #a0531a 40%, #7a3a0d 100%);
            clip-path: ellipse(60% 55% at 50% 100%);
        }
        .dune2 {
            position: absolute;
            bottom: 0; left: -10%; right: 30%;
            height: 80%;
            background: linear-gradient(180deg, #b86e20 0%, #8a4810 100%);
            clip-path: ellipse(70% 60% at 30% 100%);
        }
        .dune3 {
            position: absolute;
            bottom: 0; left: 40%; right: -10%;
            height: 75%;
            background: linear-gradient(180deg, #d4893a 0%, #9e5518 100%);
            clip-path: ellipse(65% 55% at 70% 100%);
        }
        .dune4 {
            position: absolute;
            bottom: 0; left: -5%; right: -5%;
            height: 40%;
            background: linear-gradient(180deg, #e09240 0%, #c47020 60%, #8a4a10 100%);
            clip-path: ellipse(55% 70% at 50% 100%);
        }

        /* رمال متحركة */
        .sand-particles {
            position: absolute;
            bottom: 30%;
            left: 0; right: 0;
            height: 60px;
            overflow: hidden;
        }
        .sand-p {
            position: absolute;
            width: 3px; height: 1px;
            background: rgba(253,230,138,0.6);
            border-radius: 2px;
            animation: sandDrift linear infinite;
        }
        .sand-p:nth-child(1)  { bottom: 20px; left: 10%;  animation-duration: 6s;  animation-delay: 0s;   width: 4px; }
        .sand-p:nth-child(2)  { bottom: 35px; left: 25%;  animation-duration: 8s;  animation-delay: -2s; }
        .sand-p:nth-child(3)  { bottom: 10px; left: 40%;  animation-duration: 5s;  animation-delay: -1s;  width: 5px; }
        .sand-p:nth-child(4)  { bottom: 45px; left: 55%;  animation-duration: 7s;  animation-delay: -3s; }
        .sand-p:nth-child(5)  { bottom: 25px; left: 70%;  animation-duration: 9s;  animation-delay: -4s;  width: 4px; }
        .sand-p:nth-child(6)  { bottom: 50px; left: 85%;  animation-duration: 6s;  animation-delay: -1s; }
        .sand-p:nth-child(7)  { bottom: 15px; left: 5%;   animation-duration: 10s; animation-delay: -5s;  width: 6px; }
        .sand-p:nth-child(8)  { bottom: 40px; left: 60%;  animation-duration: 7s;  animation-delay: -2s; }
        .sand-p:nth-child(9)  { bottom: 30px; left: 78%;  animation-duration: 5s;  animation-delay: -3s;  width: 4px; }
        .sand-p:nth-child(10) { bottom: 55px; left: 92%;  animation-duration: 8s;  animation-delay: -6s; }
        @keyframes sandDrift {
            0%   { transform: translateX(0) translateY(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.8; }
            100% { transform: translateX(120px) translateY(-20px); opacity: 0; }
        }

        /* نجوم خفيفة */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40%;
            background:
                radial-gradient(1px 1px at 8%  8%,  rgba(255,255,255,0.9) 0%, transparent 100%),
                radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1px 1px at 35% 5%,  rgba(255,255,255,0.8) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 12%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 65% 7%,  rgba(255,255,255,0.9) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 18%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1px 1px at 92% 10%, rgba(255,255,255,0.8) 0%, transparent 100%),
                radial-gradient(1px 1px at 15% 28%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 45% 22%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 72% 30%, rgba(255,255,255,0.4) 0%, transparent 100%);
            animation: twinkle 3s ease-in-out infinite alternate;
        }
        @keyframes twinkle { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        /* ===== نخلة متحركة SVG ===== */
        .palm-tree {
            position: absolute;
            bottom: 30%;
            right: 8%;
            width: 90px;
            transform-origin: bottom center;
        }
        .palm-trunk { animation: trunkSway 4s ease-in-out infinite; transform-origin: bottom center; }
        .palm-leaves { animation: leavesSway 3s ease-in-out infinite; transform-origin: bottom center; }
        @keyframes trunkSway {
            0%,100% { transform: rotate(-2deg); }
            50%      { transform: rotate(3deg); }
        }
        @keyframes leavesSway {
            0%,100% { transform: rotate(-4deg); }
            50%      { transform: rotate(5deg); }
        }

        /* نخلة ثانية صغيرة */
        .palm-tree2 {
            position: absolute;
            bottom: 32%;
            left: 6%;
            width: 60px;
            transform-origin: bottom center;
        }
        .palm-trunk2 { animation: trunkSway2 5s ease-in-out infinite; transform-origin: bottom center; }
        .palm-leaves2 { animation: leavesSway2 4s ease-in-out infinite; transform-origin: bottom center; }
        @keyframes trunkSway2 {
            0%,100% { transform: rotate(1deg); }
            50%      { transform: rotate(-3deg); }
        }
        @keyframes leavesSway2 {
            0%,100% { transform: rotate(2deg); }
            50%      { transform: rotate(-5deg); }
        }

        /* ===== NAV ===== */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(60,20,0,0.65);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(245,158,11,0.25);
            padding: 13px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #fcd34d, #f59e0b, #fef3c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 8px rgba(245,158,11,0.5));
        }
        .nav-btns { display: flex; gap: 8px; }
        .nav-btn {
            padding: 7px 14px;
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        .nav-btn-amber {
            background: rgba(245,158,11,0.18);
            color: #fcd34d;
            border: 1px solid rgba(245,158,11,0.3);
        }
        .nav-btn-amber:hover { background: rgba(245,158,11,0.32); }
        .nav-btn-blue {
            background: rgba(59,130,246,0.18);
            color: #93c5fd;
            border: 1px solid rgba(59,130,246,0.3);
        }
        .nav-btn-blue:hover { background: rgba(59,130,246,0.32); }

        /* ===== MAIN ===== */
        main {
            position: relative;
            z-index: 10;
            max-width: 480px;
            margin: 0 auto;
            padding: 28px 18px 80px;
        }

        .view { display: block; }
        .view.hidden { display: none; }

        /* ===== HERO ===== */
        .hero { text-align: center; margin-bottom: 32px; padding-top: 8px; }
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #fcd34d 0%, #f97316 50%, #fef3c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 12px rgba(245,158,11,0.6));
            animation: glowTitle 3s ease-in-out infinite alternate;
        }
        @keyframes glowTitle {
            0%   { filter: drop-shadow(0 0 8px rgba(245,158,11,0.4)); }
            100% { filter: drop-shadow(0 0 22px rgba(245,158,11,0.9)); }
        }
        .hero p { color: rgba(255,220,150,0.65); font-size: 0.87rem; margin-top: 6px; }
        .hero-line {
            width: 70px; height: 3px;
            background: linear-gradient(90deg, transparent, #f59e0b, transparent);
            margin: 12px auto 0; border-radius: 2px;
            animation: pulseLine 2s ease-in-out infinite;
        }
        @keyframes pulseLine {
            0%,100% { opacity: 0.5; width: 50px; }
            50%      { opacity: 1;   width: 90px; }
        }

        /* ===== SECTION LABEL ===== */
        .section-label {
            font-size: 0.68rem;
            letter-spacing: 3px;
            color: rgba(252,211,77,0.55);
            margin-bottom: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* ===== CARDS ===== */
        .card-grid { display: grid; gap: 11px; }
        .card {
            background: rgba(40,15,0,0.55);
            border: 1px solid rgba(245,158,11,0.15);
            border-radius: 16px;
            padding: 18px 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            text-align: right;
            font-family: 'Tajawal', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            color: #fef3c7;
            display: flex;
            align-items: center;
            gap: 13px;
            width: 100%;
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(245,158,11,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .card:hover::after { opacity: 1; }
        .card:hover {
            border-color: rgba(245,158,11,0.45);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(245,158,11,0.18);
        }
        .card:active { transform: scale(0.97); }
        .card-icon { font-size: 1.6rem; flex-shrink: 0; }
        .card-amber { border-right: 3px solid #f59e0b; }
        .card-blue  { border-right: 3px solid #60a5fa; }
        .card-red   { border-right: 3px solid #f87171; }

        /* ===== BACK BTN ===== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(40,15,0,0.5);
            border: 1px solid rgba(245,158,11,0.2);
            color: rgba(253,230,138,0.7);
            padding: 7px 16px;
            border-radius: 30px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }
        .back-btn:hover { background: rgba(245,158,11,0.15); color: #fcd34d; }

        /* ===== DETAIL ===== */
        .detail-wrap {
            background: rgba(30,10,0,0.65);
            border: 1px solid rgba(245,158,11,0.2);
            border-top: 3px solid #f59e0b;
            border-radius: 22px;
            padding: 28px 20px;
            min-height: 60vh;
            backdrop-filter: blur(12px);
        }
        .detail-title {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fcd34d, #fef3c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 18px;
        }
        .detail-text {
            color: rgba(255,230,160,0.75);
            line-height: 2.1;
            font-size: 1rem;
            text-align: justify;
            white-space: pre-line;
        }

        /* ===== SOCIAL ===== */
        .social-section {
            margin-top: 28px;
        }
        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .social-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 14px;
            border-radius: 14px;
            text-decoration: none;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s;
            border: 1px solid transparent;
            backdrop-filter: blur(8px);
            color: #fff;
        }
        .social-btn:hover { transform: translateY(-3px); filter: brightness(1.2); }
        .social-btn:active { transform: scale(0.96); }
        .social-icon { font-size: 1.4rem; flex-shrink: 0; }

        .s-instagram { background: rgba(193,53,132,0.25); border-color: rgba(193,53,132,0.4); }
        .s-facebook  { background: rgba(24,119,242,0.25); border-color: rgba(24,119,242,0.4); }
        .s-telegram  { background: rgba(0,136,204,0.25);  border-color: rgba(0,136,204,0.4); }
        .s-x         { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
        .s-whatsapp  { background: rgba(37,211,102,0.2);  border-color: rgba(37,211,102,0.4); }

        /* whatsapp full width */
        .social-full { grid-column: 1 / -1; }
    </style>
</head>

    <!-- شريط التنقل -->
    <nav>
        <div class="nav-btns">
            <button class="nav-btn nav-btn-amber" onclick="showMenu('searchMenu')">🔍 استكشف</button>
            <button class="nav-btn nav-btn-blue"  onclick="showMenu('newsMenu')">📢 الأخبار</button>
